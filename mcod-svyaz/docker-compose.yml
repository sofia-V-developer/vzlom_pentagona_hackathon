services:
  mcod:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mcod-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  mcod-data:
